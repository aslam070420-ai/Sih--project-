{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="fd-auth-stage fd-auth-stage-login">
  <div class="fd-auth-orb fd-auth-orb-a" aria-hidden="true"></div>
  <div class="fd-auth-orb fd-auth-orb-b" aria-hidden="true"></div>
  <div class="fd-auth-wrap fd-auth-wrap-v9">
    <div class="fd-card fd-auth-main-card p-4 p-md-5">
      <div class="fd-auth-mark" aria-hidden="true"><span>🌱</span><i></i></div>
      <div class="text-center mb-4 fd-auth-heading">
        <h3 class="fw-bold mb-1">Welcome back</h3>
        <p class="fd-subtle mb-0">Sign in to your FarmDirect account</p>
      </div>
      <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}" class="fd-auth-form">
        <div class="mb-3 fd-field-shell">
          <label class="form-label">Email</label>
          <div class="fd-field-with-icon">
            <i class="bi bi-envelope"></i>
            <input type="email" class="form-control" name="email" placeholder="you@example.in" required autofocus>
          </div>
        </div>
        <div class="mb-3 fd-field-shell">
          <label class="form-label">Password</label>
          <div class="fd-field-with-icon">
            <i class="bi bi-shield-lock"></i>
            <input type="password" class="form-control" name="password" placeholder="••••••••" required>
          </div>
        </div>
        <button class="btn btn-fd w-100 py-2 mt-1 fd-auth-submit"><i class="bi bi-box-arrow-in-right me-1"></i> Login</button>
      </form>
      <p class="text-center fd-subtle mt-3 mb-0">New to FarmDirect? <a href="{{ url_for('auth.register') }}"><b>Create an account</b></a></p>
    </div>

    <div class="fd-card fd-demo-login-card p-3 p-md-4 mt-3">
      <div class="fd-demo-login-head">
        <span class="fd-demo-login-icon"><i class="bi bi-lightning-charge-fill"></i></span>
        <div>
          <p class="tiny-note fw-bold mb-0">DEMO LOGINS — tap to autofill (hackathon judging)</p>
        </div>
      </div>
      <div class="fd-demo-login-grid">
        <button type="button" class="demo-cred fd-demo-account" data-demo-email="vikram@farmdirect.in" data-demo-password="farm123">
          <span class="fd-demo-account-icon"><i class="bi bi-flower1"></i></span>
          <span class="fd-demo-account-copy"><strong>Farmer</strong><small>vikram@farmdirect.in</small></span>
          <span class="fd-demo-account-arrow"><i class="bi bi-arrow-up-right"></i></span>
        </button>
        <button type="button" class="demo-cred fd-demo-account" data-demo-email="fpo@farmdirect.in" data-demo-password="farm123">
          <span class="fd-demo-account-icon"><i class="bi bi-people"></i></span>
          <span class="fd-demo-account-copy"><strong>FPO</strong><small>fpo@farmdirect.in</small></span>
          <span class="fd-demo-account-arrow"><i class="bi bi-arrow-up-right"></i></span>
        </button>
        <button type="button" class="demo-cred fd-demo-account" data-demo-email="priya@example.in" data-demo-password="farm123">
          <span class="fd-demo-account-icon"><i class="bi bi-basket"></i></span>
          <span class="fd-demo-account-copy"><strong>Consumer</strong><small>priya@example.in</small></span>
          <span class="fd-demo-account-arrow"><i class="bi bi-arrow-up-right"></i></span>
        </button>
        <button type="button" class="demo-cred fd-demo-account" data-demo-email="buy@annapurna.in" data-demo-password="farm123">
          <span class="fd-demo-account-icon"><i class="bi bi-building"></i></span>
          <span class="fd-demo-account-copy"><strong>Bulk Buyer</strong><small>buy@annapurna.in</small></span>
          <span class="fd-demo-account-arrow"><i class="bi bi-arrow-up-right"></i></span>
        </button>
        <button type="button" class="demo-cred fd-demo-account fd-demo-account-wide" data-demo-email="admin@farmdirect.in" data-demo-password="admin123">
          <span class="fd-demo-account-icon"><i class="bi bi-shield-lock"></i></span>
          <span class="fd-demo-account-copy"><strong>Admin &amp; Logistics</strong><small>admin@farmdirect.in</small></span>
          <span class="fd-demo-account-arrow"><i class="bi bi-arrow-up-right"></i></span>
        </button>
      </div>
    </div>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>
(() => {
  const email = document.querySelector('input[name="email"]');
  const password = document.querySelector('input[name="password"]');
  document.querySelectorAll('.demo-cred').forEach((button) => {
    button.addEventListener('click', () => {
      if (!email || !password) return;
      email.value = button.dataset.demoEmail || '';
      password.value = button.dataset.demoPassword || '';
      document.querySelectorAll('.demo-cred').forEach((item) => item.classList.remove('demo-cred-selected'));
      button.classList.add('demo-cred-selected');
      email.dispatchEvent(new Event('input', { bubbles: true }));
      password.dispatchEvent(new Event('input', { bubbles: true }));
      email.classList.add('fd-v9-autofill-flash');
      password.classList.add('fd-v9-autofill-flash');
      window.setTimeout(() => {
        email.classList.remove('fd-v9-autofill-flash');
        password.classList.remove('fd-v9-autofill-flash');
      }, 620);
    });
  });
})();
</script>
{% endblock %}
